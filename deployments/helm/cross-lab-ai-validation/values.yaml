replicaCount: 3

image:
  repository: ghcr.io/kogunlowo123/cross-lab-ai-validation
  tag: ""  # defaults to .Chart.AppVersion
  digest: ""  # set to pin an immutable sha256 digest; takes precedence over tag
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: cross-lab-ai-validation
  # Cloud workload identity bindings, e.g.
  #   eks.amazonaws.com/role-arn (AWS IRSA)
  #   azure.workload.identity/client-id (Azure Workload ID)
  #   iam.gke.io/gcp-service-account (GKE Workload Identity)
  annotations: {}

podLabels: {}

# Deployment-specific values marked REQUIRED have no default; the chart
# refuses to render until they are set (helm install --values <env>.yaml).
clv:
  environment: production
  publicUrl: ""  # REQUIRED: public HTTPS base URL (A2A agent card url, MCP host check)
  oidc:
    issuer: ""  # REQUIRED: enterprise OIDC issuer for laboratory staff
    audience: ""  # REQUIRED: audience of staff access tokens
    jwksUrl: ""  # REQUIRED: JWKS URL of the enterprise OIDC issuer
    rolesClaim: roles
    sitesClaim: sites
  identityFabricUrl: ""  # REQUIRED: agent-identity-fabric base URL
  signatureMaxAuthAgeSeconds: 300
  minAggregateCases: 20
  mcpAllowedHosts: []  # defaults to the host of publicUrl
  logLevel: INFO
  otlpEndpoint: ""  # optional OTLP gRPC endpoint

# Secrets are created by the platform secret operator (External Secrets,
# Secrets Store CSI) from the cloud secret manager provisioned by Terraform.
secrets:
  # Secret holding key DATABASE_URL (postgresql+asyncpg://...).
  database: cross-lab-ai-validation-database
  # Secret holding audit-<kid>.pem, the Ed25519 audit signing key.
  auditKey: cross-lab-ai-validation-audit-key
  auditKeyFile: ""  # REQUIRED: file name of the audit key within secrets.auditKey

audit:
  storageClassName: ""
  size: 20Gi

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  host: ""  # required when ingress.enabled
  tlsSecret: cross-lab-ai-validation-tls
  annotations: {}

resources:
  requests:
    cpu: 250m
    memory: 384Mi
  limits:
    cpu: "1"
    memory: 768Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  minAvailable: 2

networkPolicy:
  enabled: true
  # Namespaces whose pods (site agents, orchestrators) may call the platform.
  allowedNamespaceLabels:
    agent-platform/member: "true"
  monitoringNamespaceLabels:
    kubernetes.io/metadata.name: observability
  ingressNamespaceLabels:
    kubernetes.io/metadata.name: ingress-nginx

serviceMonitor:
  enabled: false
  interval: 30s

nodeSelector: {}
tolerations: []
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway
