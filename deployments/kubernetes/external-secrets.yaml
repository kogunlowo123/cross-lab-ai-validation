# Syncs platform secrets from the cloud secret manager provisioned by
# deployments/terraform/<cloud>. Requires the External Secrets Operator and a
# ClusterSecretStore named "platform-secrets" bound to that secret manager.
# Remote keys match the names Terraform creates.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: cross-lab-ai-validation-database
  namespace: lab-ai-assurance
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform-secrets
  target:
    name: cross-lab-ai-validation-database
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: cross-lab-ai-validation-database-url
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: cross-lab-ai-validation-audit-key
  namespace: lab-ai-assurance
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform-secrets
  target:
    name: cross-lab-ai-validation-audit-key
    creationPolicy: Owner
  dataFrom:
    - find:
        name:
          regexp: "^cross-lab-ai-validation-audit-key-"
      rewrite:
        - regexp:
            source: "^cross-lab-ai-validation-audit-key-(.*)$"
            target: "audit-$1.pem"
