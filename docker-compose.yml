# Local development stack: assurance platform + PostgreSQL + an OIDC provider
# standing in for the enterprise IdP and the cluster workload issuer, the
# published agent-identity-fabric, and an OpenTelemetry collector.
# Uses in-memory signing keys; never use this configuration outside a
# developer workstation.
name: cross-lab-ai-validation

services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: clv
      POSTGRES_USER: clv
      POSTGRES_PASSWORD: clv-local-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clv -d clv"]
      interval: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  oidc:
    image: ghcr.io/navikt/mock-oauth2-server:2.1.10
    environment:
      SERVER_PORT: "8080"
    ports:
      - "8081:8080"

  fabric:
    build: https://github.com/kogunlowo123/agent-identity-fabric.git#v0.1.0
    depends_on:
      oidc:
        condition: service_started
    environment:
      FABRIC_ENVIRONMENT: development
      FABRIC_DEV_EPHEMERAL_KEYS: "true"
      FABRIC_TRUST_DOMAIN: agents.local
      FABRIC_ISSUER: http://fabric:8080
      FABRIC_DATABASE_URL: sqlite+aiosqlite:////tmp/fabric.db
      FABRIC_AUDIT_LOG_PATH: /tmp/fabric-audit.jsonl
      FABRIC_WORKLOAD_ISSUERS: '{"http://oidc:8080/workload": "http://oidc:8080/workload/jwks"}'
      FABRIC_ADMIN_ISSUER: http://oidc:8080/admin
      FABRIC_ADMIN_AUDIENCE: identity-fabric-admin
      FABRIC_ADMIN_JWKS_URL: http://oidc:8080/admin/jwks
    ports:
      - "8082:8080"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./deployments/docker/otel-collector.yaml:/etc/otelcol/config.yaml:ro

  assurance:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      fabric:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      CLV_ENVIRONMENT: development
      CLV_DEV_EPHEMERAL_AUDIT_KEY: "true"
      CLV_PUBLIC_URL: http://localhost:8080
      CLV_DATABASE_URL: postgresql+asyncpg://clv:clv-local-only@postgres:5432/clv
      CLV_AUDIT_LOG_PATH: /var/lib/cross-lab-ai-validation/audit/audit.jsonl
      CLV_OIDC_ISSUER: http://oidc:8080/staff
      CLV_OIDC_AUDIENCE: cross-lab-ai-validation
      CLV_OIDC_JWKS_URL: http://oidc:8080/staff/jwks
      CLV_IDENTITY_FABRIC_URL: http://fabric:8080
      CLV_MCP_ALLOWED_HOSTS: '["localhost:*", "127.0.0.1:*", "assurance:8080"]'
      CLV_OTLP_ENDPOINT: http://otel-collector:4317
      CLV_LOG_LEVEL: DEBUG

volumes:
  pgdata:
